<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gallery - PhotoFind</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/images.css" />
  </head>
  <body>
    <!-- navigation (same on every page) -->
    <nav class="navbar navbar-expand border-bottom">
      <div class="container">
        <a class="navbar-brand fw-semibold" href="index.html">PhotoFind</a>
        <ul class="navbar-nav ms-auto flex-wrap">
          <li class="nav-item">
            <a class="nav-link" href="index.html">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="gallery.html"
              >Gallery</a
            >
          </li>
          <li class="nav-item">
            <a class="nav-link" href="search.html">Search</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="shotlists.html">Shot Lists</a>
          </li>
        </ul>
      </div>
    </nav>

    <main class="container py-4">
      <div
        class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3"
      >
        <h1 class="h3 mb-0">Gallery</h1>
        <a class="btn btn-dark" href="add.html">+ Add image</a>
      </div>

      <div id="message-area"></div>

      <!-- tag filter buttons, filled in by gallery.js -->
      <div
        id="tag-filter"
        class="tag-filter d-flex gap-2 pb-2 mb-3"
        role="group"
        aria-label="filter by tag"
      ></div>

      <p id="gallery-summary" class="small text-body-secondary"></p>

      <div
        id="gallery-grid"
        class="row row-cols-2 row-cols-md-3 row-cols-lg-4 g-3"
      ></div>

      <div class="text-center mt-4">
        <button id="load-more" class="btn btn-outline-dark d-none">
          Load more
        </button>
      </div>
    </main>
    <script type="module" src="./js/gallery.js"></script>
  </body>
</html>
