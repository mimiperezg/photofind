<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shot Lists</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/shotlists.css" />
  </head>
  <body>
    <main class="container py-4">
      <!-- this will be the header row. shot lists and new shot list button will go here -->
      <div
        class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3"
      >
        <h1 class="h3 mb-0">Shot Lists</h1>
        <button class="btn btn-dark" id="newListBtn">+ New shot list</button>
      </div>

      <!-- this will be categoies of shotlists  - all, upcoming, in progress, completed. its a filter -->
      <div class="d-flex flex-wrap align-items-center gap-2 mb-3">
        <div class="btn-group" role="group" aria-label="filter by status">
          <button class="btn btn-outline-dark" data-status="all">All</button>
          <button class="btn btn-outline-dark" data-status="upcoming">
            Upcoming
          </button>
          <button class="btn btn-outline-dark" data-status="in-progress">
            In Progress
          </button>
          <button class="btn btn-outline-dark" data-status="completed">
            Completed
          </button>
        </div>
      </div>

      <!-- left column will be the shot lists -->
      <div
        id="shotlists-container"
        class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4"
      ></div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="./js/shotlists.js"></script>
  </body>
</html>
