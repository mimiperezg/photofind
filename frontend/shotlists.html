<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shot Lists</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/shotlists.css" />
  </head>
  <body>
    <!-- navigation (same on every page) -->
    <nav class="navbar navbar-expand border-bottom">
      <div class="container">
        <a class="navbar-brand fw-semibold" href="index.html">PhotoFind</a>
        <ul class="navbar-nav ms-auto flex-wrap">
          <li class="nav-item">
            <a class="nav-link" href="index.html">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="gallery.html">Gallery</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="search.html">Search</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="shotlists.html"
              >Shot Lists</a
            >
          </li>
        </ul>
      </div>
    </nav>

    <main class="container py-4">
      <!-- this will be the header row. shot lists and new shot list button will go here -->
      <div class="page-header">
        <h1 class="h3 mb-0">Shot Lists</h1>
        <!--new shot list button, alongside messages to users for creating and deleting -->
        <div class="d-flex align-items-center gap-2">
          <div id="message-area"></div>
          <button class="btn btn-dark" id="newListBtn">+ New shot list</button>
        </div>
      </div>

      <!-- this will be categories of shotlists - all, upcoming, in progress, completed. its a filter -->
      <div class="filter-row">
        <div class="btn-group" role="group" aria-label="filter by status">
          <button class="btn btn-outline-dark" data-status="all">All</button>
          <button class="btn btn-outline-dark" data-status="upcoming">
            Upcoming
          </button>
          <button class="btn btn-outline-dark" data-status="in-progress">
            In Progress
          </button>
          <button class="btn btn-outline-dark" data-status="completed">
            Completed
          </button>
        </div>
      </div>

      <div class="row g-3">
        <!-- left column will be the shot lists -->
        <section class="col-lg-5">
          <div id="shotlists-container" class="d-flex flex-column gap-2"></div>

          <!-- pagination -->
          <div class="pagination-controls">
            <button class="btn btn-outline-dark btn-sm" id="prev-page">
              Previous
            </button>
            <span id="page-info" class="page-info"></span>
            <button class="btn btn-outline-dark btn-sm" id="next-page">
              Next
            </button>
          </div>
        </section>

        <!-- right column is selected shot list details -->
        <section class="col-lg-7">
          <div id="shotlist-details" class="card">
            <div class="card-body text-body-secondary">
              Select shot list to view details
            </div>
          </div>
        </section>
      </div>

      <!-- bottom of the page is statistics on user's shot lists -->
      <section class="card mt-4 stats-card">
        <div class="card-body">
          <h2 class="h5 mb-3">Statistics</h2>
          <div id="shotlists-stats" class="row g-3 text-center"></div>
        </div>
      </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="./js/shotlists.js"></script>
  </body>
</html>
